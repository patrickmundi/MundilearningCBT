<header><h1>Cell Biology &amp; Biological Molecules</h1><p>Cell Biology · Micromolecules &amp; Macromolecules · Vitamins · 40 questions · No timer</p><p class="byline">By <strong>MundiLearning CBT</strong></p></header>
<main><div id="app"></div><p class="foot">MundiLearning CBT · Based on the supplied CELL NEW NOTE course material.</p></main>
<script>
"use strict";
const QUESTIONS=[["Who first coined the term “cell” after observing thin slices of cork in 1665?",["Theodor Schwann","Robert Hooke","Matthias Schleiden","Rudolf Virchow"],1,"The notes state that Robert Hooke coined the term cell in 1665 after observing cork through a primitive compound microscope."],["A cell is best defined as the:",["Largest unit of an organism","Basic structural and functional unit of life","Smallest organ in the body","Non-living material between tissues"],1,"The cell is the smallest unit that possesses the characteristics of life and serves as the basic structural and functional unit."],["Which statement is part of the cell theory?",["All cells arise spontaneously from non-living matter","All living things are composed of one or more cells","Only animals are made of cells","Cells do not contain genetic material"],1,"The cell theory states that all living things are composed of one or more cells."],["According to the additional statement to cell theory described in the notes, DNA:",["Is found only outside cells","Carries hereditary traits and controls cell activities","Is present only in plant cells","Has no role in cell function"],1,"The notes add that cells carry DNA, which passes traits from parent to offspring and controls cell activities."],["Prokaryotic cells are characterised by the absence of:",["Cytoplasm","Ribosomes","A true nucleus and membrane-bound organelles","A cell membrane"],2,"Prokaryotes lack a true nucleus and membrane-bound organelles, although they contain cytoplasm, ribosomes and other structures."],["In a prokaryotic cell, the region containing its circular chromosomal DNA is called the:",["Nucleolus","Nucleoid","Nuclear envelope","Golgi body"],1,"The nucleoid is the region in the cytoplasm where the prokaryotic circular chromosomal DNA is found."],["Small extra-chromosomal circular pieces of DNA in prokaryotes are called:",["Plasmids","Cristae","Chromatids","Vacuoles"],0,"Plasmids are extra-chromosomal circular DNA molecules that may occur in prokaryotic cells."],["Which of the following organisms is listed as a eukaryote?",["Bacterium","Archaean","Fungus","Mycoplasma"],2,"Fungi, plants, animals and most protists are listed as eukaryotes."],["The main function of the cell membrane is to:",["Produce all cellular DNA","Control the movement of substances into and out of the cell","Manufacture ribosomes","Store hereditary information"],1,"The plasma membrane is selectively permeable and controls the flow of substances into and out of the cell."],["The cytosol is:",["The fluid portion of cytoplasm not occupied by organelles","The membrane around the nucleus","The DNA region of a bacterium","The outer layer of a plant cell wall"],0,"The notes define cytosol as the portion of the cytoplasm not occupied by organelles."],["Which organelle contains the cell's genetic material and directs cell activities in eukaryotes?",["Lysosome","Nucleus","Golgi apparatus","Ribosome"],1,"The nucleus contains DNA or chromosomes and directs cell activities through the information stored in the genetic material."],["The tiny openings in the nuclear envelope through which materials move are called:",["Cristae","Plasmodesmata","Nuclear pores","Thylakoids"],2,"Nuclear pores are openings in the double nuclear membrane that permit movement of materials into and out of the nucleus."],["Which organelle is described as the powerhouse of the cell because it produces ATP?",["Mitochondrion","Lysosome","Golgi apparatus","Centriole"],0,"Mitochondria play an important role in producing energy in the form of adenosine triphosphate (ATP)."],["The folds of the inner mitochondrial membrane are called:",["Grana","Cristae","Cisternae","Thylakoids"],1,"The inner mitochondrial membrane is folded into projections called cristae."],["What is the main function of ribosomes?",["Lipid storage","Protein synthesis","Cell movement","Intracellular digestion"],1,"Ribosomes are the sites of protein synthesis. The notes identify 70S ribosomes in prokaryotes and 80S in eukaryotes."],["The cell wall of bacteria contains:",["Cellulose","Chitin","Peptidoglycan","Cholesterol"],2,"The comparison table in the notes describes the bacterial cell wall as containing peptidoglycan."],["Which structure is associated with plant cells and carries out photosynthesis?",["Lysosome","Chloroplast","Centriole","Nucleolus"],1,"Chloroplasts are plastids involved in photosynthesis in plant cells."],["The Golgi apparatus is mainly involved in:",["Modifying, packaging and distributing cell products","Storing the cell's chromosomes","Producing ATP","Separating chromosomes during cell division"],0,"The Golgi apparatus processes and packages materials for transport within or out of the cell."],["Which technique is identified in the notes as the most widely used method for fractionating cellular components?",["Filtration","Centrifugation","Distillation","Chromatography"],1,"The notes identify centrifugation as the most widely used technique for cell fractionation."],["According to the notes, a centrifuge operating above which speed is an ultracentrifuge?",["2,000 rpm","5,000 rpm","10,000 rpm","20,000 rpm"],3,"The notes describe a centrifuge working at speeds in excess of 20,000 revolutions per minute as an ultracentrifuge."],["Micromolecules are described in the notes as having molecular weights in which range?",["18–800 dalton","Over 10,000 dalton","800–1,000 dalton only","Over 1,000,000 dalton"],0,"The notes give a molecular-weight range of 18 to 800 dalton for micromolecules."],["Which group contains the four main biological macromolecules listed in the notes?",["Water, minerals, vitamins and ions","Carbohydrates, proteins, nucleic acids and lipids","Glucose, oxygen, salts and water","Vitamins, amino acids, gases and minerals"],1,"The four major macromolecules listed are carbohydrates, proteins, nucleic acids and lipids."],["The repeating small units that make up polymers are called:",["Isomers","Monomers","Enzymes","Ions"],1,"A polymer is made up of repeating smaller units known as monomers."],["Vitamins are best described as:",["Inorganic substances needed in large amounts","Organic substances required in small amounts for normal growth and body function","Energy-producing polymers","Minerals stored only in bones"],1,"The notes define vitamins as organic substances needed in small amounts but essential for normal growth and body function."],["Which of the following is identified as a cause of vitamin deficiency?",["Improved absorption","Increased losses","Excessive cell division only","High water intake in every case"],1,"The notes list insufficient intake, impaired absorption, impaired metabolism and increased losses as causes of vitamin deficiency."],["Which set contains the fat-soluble vitamins?",["B, C, B1 and B12","A, D, E and K","A, B, C and D","C, D, E and B"],1,"The fat-soluble vitamins are A, D, E and K, remembered by the acronym ADEK."],["Which vitamins are water-soluble according to the notes?",["A and D","E and K","Vitamin B complex and vitamin C","A, E and K"],2,"The notes classify the B-complex vitamins and vitamin C as water-soluble vitamins."],["The main active form of vitamin A identified in the notes is:",["Retinol","Calcitriol","Ascorbic acid","Alpha-tocopherol"],0,"Retinol is identified as the main active form of vitamin A."],["Deficiency of vitamin A may cause:",["Beriberi","Night blindness","Rickets","Scurvy"],1,"Vitamin A is needed for vision in dim light; deficiency may cause night blindness and xerophthalmia."],["The plant precursor of vitamin A mentioned in the notes is:",["Thiamine","Beta-carotene","Phylloquinone","Niacin"],1,"Beta-carotene is a provitamin found in plant tissues and can give rise to vitamin A."],["Vitamin D is sometimes called the sunlight vitamin because:",["It is produced only in the liver","Sunlight is essential for its synthesis in the skin","It is found only in water","It prevents all skin diseases"],1,"The notes explain that ultraviolet radiation from sunlight helps convert a skin precursor into vitamin D3."],["Deficiency of vitamin D may result in:",["Rickets in children and osteomalacia in adults","Scurvy in children and beriberi in adults","Night blindness and pellagra","Bleeding gums only"],0,"The notes associate vitamin D deficiency with rickets in children and osteomalacia in adults."],["The principal antioxidant form of vitamin E used by the human body is:",["Retinol","Alpha-tocopherol","Calciferol","Cobalamin"],1,"The notes identify alpha-tocopherol as the form of vitamin E utilised by the human body and describe its antioxidant role."],["Vitamin K is important in the body mainly because it supports:",["Blood clotting","Night vision","Collagen formation","Calcium excretion"],0,"Vitamin K supports the formation of blood-clotting proteins, including active prothrombin."],["Vitamin C is chemically known as:",["Niacin","Ascorbic acid","Folic acid","Riboflavin"],1,"The notes identify vitamin C as ascorbic acid and describe its antioxidant properties."],["Deficiency of vitamin C is associated with:",["Pellagra","Rickets","Scurvy","Beriberi"],2,"Scurvy is one of the deficiency disorders associated with vitamin C."],["Which vitamin B is known as thiamine, and whose deficiency is associated with beriberi?",["B1","B3","B9","B12"],0,"Vitamin B1 is thiamine. The notes associate its deficiency with beriberi."],["Niacin is also known as vitamin B3. Its deficiency is associated with:",["Rickets","Pellagra","Scurvy","Night blindness"],1,"The notes identify pellagra as a deficiency disorder associated with vitamin B3 (niacin)."],["Which vitamin is identified as folic acid and is important in DNA and RNA synthesis?",["B2","B6","B9","B12"],2,"Vitamin B9 (folic acid) is involved in DNA, RNA and red blood cell synthesis; the notes also mention prevention of birth defects."],["Vitamin B12 is also known as:",["Cobalamin","Pyridoxine","Biotin","Pantothenic acid"],0,"Vitamin B12 is cobalamin. The notes describe its role in red blood cell, DNA, RNA and myelin formation."]];
const SUBMIT_URL="https://script.google.com/macros/s/AKfycbyOP1esKZzCUfkc0Pn_eMZVqyBup3ideOXZFDvjkiWbrXbLfwmgaBXY-01Fy9rA-ToFCw/exec";
const COURSE="Cell Biology & Biological Molecules";
const LETTERS=["A","B","C","D"],app=document.getElementById("app");
let state=null,nameDraft="";
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function grade(p){return p>=70?["A","Excellent"]:p>=60?["B","Very good"]:p>=50?["C","Good"]:p>=45?["D","Fair"]:p>=40?["E","Pass"]:["F","Fail"];}
function home(msg=""){app.innerHTML='<section class="card"><h2>Welcome</h2><p>This CBT contains <b>40 multiple-choice questions</b> based on the supplied course notes covering cells, cell structures and functions, biological molecules, and vitamins. There is <b>no timer</b>.</p><ul><li>Enter your full name and select <b>Start CBT</b>.</li><li>Select an option and click <b>Submit Answer</b> to see feedback and an explanation.</li><li>Click <b>Next</b> to continue. Use the question navigator to revisit answered questions.</li><li>Click <b>Submit CBT</b> to view your score and review your answers.</li></ul><label for="name"><b>Your full name</b></label><input id="name" type="text" autocomplete="name" maxlength="90" placeholder="Enter your full name" value="'+esc(nameDraft)+'">'+(msg?'<p style="color:var(--bad)">'+esc(msg)+'</p>':'')+'<button class="primary" id="start">Start CBT ▶</button></section>';document.getElementById("start").onclick=start;document.getElementById("name").onkeydown=e=>{if(e.key==="Enter")start();};}
function start(){let n=document.getElementById("name").value.trim();nameDraft=n;if(!n){home("Please enter your full name to begin.");return;}state={name:n,index:0,selected:Array(QUESTIONS.length).fill(-1),done:Array(QUESTIONS.length).fill(false),confirm:false};questionPage();}
function firstUnanswered(){let i=state.done.indexOf(false);return i===-1?QUESTIONS.length-1:i;}
function go(i){if(i<0||i>=QUESTIONS.length||i>firstUnanswered())return;state.index=i;state.confirm=false;questionPage();}
function choose(i){if(state.done[state.index])return;state.selected[state.index]=i;questionPage();}
function mark(){let i=state.index;if(state.done[i]||state.selected[i]===-1)return;state.done[i]=true;state.confirm=false;questionPage();}
function questionPage(){const i=state.index,q=QUESTIONS[i],done=state.done[i],selected=state.selected[i],count=state.done.filter(Boolean).length;let page='<div class="topline"><span><b>'+esc(state.name)+'</b></span><span>Answered: '+count+' / '+QUESTIONS.length+'</span></div><div class="progress"><div style="width:'+(count/QUESTIONS.length*100)+'%"></div></div><section class="card"><div class="note">Question '+(i+1)+' of '+QUESTIONS.length+'</div><div class="question">'+esc(q[0])+'</div>';q[1].forEach((opt,k)=>{let cls="option"+(done?(k===q[2]?" correct":k===selected?" incorrect":""):(k===selected?" selected":""));page+='<button type="button" class="'+cls+'" data-pick="'+k+'" '+(done?"disabled":"")+'><b>'+LETTERS[k]+'</b><span>'+esc(opt)+'</span></button>';});if(done){let right=selected===q[2];page+='<div class="explanation '+(right?"":"wrong")+'"><b>'+(right?"Correct!":"Incorrect.")+'</b> Correct answer: <b>'+LETTERS[q[2]]+'. '+esc(q[1][q[2]])+'</b>.<br>'+esc(q[3])+'</div>';}page+='<div class="actions"><div class="group"><button class="secondary" id="prev" '+(i===0?"disabled":"")+'>◀ Previous</button><button class="positive" id="mark" '+(done||selected===-1?"disabled":"")+'>Submit Answer</button></div><div class="group"><button class="primary" id="next" '+(i===QUESTIONS.length-1||!done?"disabled":"")+'>Next ▶</button><button class="finish" id="finish">Submit CBT ✔</button></div></div>';if(state.confirm)page+='<div class="warning"><b>'+(QUESTIONS.length-count)+' unanswered question(s).</b> Unanswered questions receive zero. Finish anyway?<div class="actions"><button class="finish" id="sure">Yes, submit</button><button class="secondary" id="cancel">Go back</button></div></div>';page+='</section><section class="card"><b>Question navigator</b><div class="navigator">';QUESTIONS.forEach((_,k)=>{let cls=(state.done[k]?(state.selected[k]===QUESTIONS[k][2]?"correct":"incorrect"):"")+(k===i?" active":"");page+='<button type="button" data-go="'+k+'" class="'+cls+'" '+(k>firstUnanswered()?"disabled":"")+' aria-label="Go to question '+(k+1)+'">'+(k+1)+'</button>';});page+='</div><div class="note">Green = correct · Red = incorrect · Plain = not answered. Questions unlock in sequence.</div></section>';app.innerHTML=page;app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.pick)));app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));document.getElementById("prev").onclick=()=>go(i-1);document.getElementById("next").onclick=()=>go(i+1);document.getElementById("mark").onclick=mark;document.getElementById("finish").onclick=()=>{if(count<QUESTIONS.length){state.confirm=true;questionPage();}else resultPage();};if(state.confirm){document.getElementById("sure").onclick=resultPage;document.getElementById("cancel").onclick=()=>{state.confirm=false;questionPage();};}window.scrollTo(0,0);}
function resultData(){let score=0;const answers=QUESTIONS.map((q,i)=>{let ok=state.done[i]&&state.selected[i]===q[2];if(ok)score++;return (i+1)+":"+(state.done[i]?LETTERS[state.selected[i]]:"-")+(ok?"+":"-");});let percent=Math.round(score/QUESTIONS.length*1000)/10;return{name:state.name,course:COURSE,score,total:QUESTIONS.length,percent,grade:grade(percent)[0],answers:answers.join(" ")};}
function reportText(d){return "MundiLearning CBT - "+COURSE+"\nStudent: "+d.name+"\nScore: "+d.score+"/"+d.total+"\nPercentage: "+d.percent+"%\nGrade: "+d.grade+"\nDate: "+new Date().toLocaleString()+"\nAnswers (+ correct, - wrong/skipped):\n"+d.answers+"\n";}
function download(){let d=resultData(),blob=new Blob([reportText(d)],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Cell_Biology_CBT_result_"+d.name.replace(/[^a-z0-9_-]/gi,"_")+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function resultPage(){const d=resultData(),g=grade(d.percent);let page='<section class="card"><h2>CBT Result</h2><p class="muted">'+esc(d.name)+' · '+esc(COURSE)+'</p><div class="stats"><div class="stat"><strong>'+d.score+'/'+d.total+'</strong><small>Score</small></div><div class="stat"><strong>'+d.percent+'%</strong><small>Percentage</small></div><div class="stat"><strong>'+g[0]+'</strong><small>'+g[1]+'</small></div></div><p class="note">Practice grading: A ≥70% · B ≥60% · C ≥50% · D ≥45% · E ≥40% · F &lt;40%.</p><div class="actions"><div class="group"><button class="primary" id="retake">Retake CBT ↻</button><button class="secondary" id="download">Download my result ↓</button></div></div><p class="note" id="sendstatus"></p></section><section class="card"><h3>Complete answer review</h3>';QUESTIONS.forEach((q,i)=>{let ans=state.done[i]?state.selected[i]:-1,ok=ans===q[2];page+='<div class="review"><span class="badge '+(ok?"":"no")+'">'+(ok?"Correct":ans<0?"Skipped":"Incorrect")+'</span> <span class="heading">Question '+(i+1)+'. '+esc(q[0])+'</span><br><b>Your answer:</b> '+(ans===-1?"—":esc(LETTERS[ans]+". "+q[1][ans]))+'<br><b>Correct answer:</b> '+esc(LETTERS[q[2]]+". "+q[1][q[2]])+'<br><span class="note">'+esc(q[3])+'</span></div>';});app.innerHTML=page+'</section>';document.getElementById("download").onclick=download;document.getElementById("retake").onclick=()=>{nameDraft=state.name;state=null;home();};window.scrollTo(0,0);sendResult(d);}
function sendResult(d){const el=document.getElementById("sendstatus");if(!SUBMIT_URL){el.textContent="Online reporting is not configured. Download your result instead.";return;}el.textContent="Attempting to send your result to the teacher's reporting service…";fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}).then(()=>{if(el.isConnected)el.textContent="Submission request completed. The reporting service does not provide a receipt, so delivery cannot be confirmed here. You may also download your result.";}).catch(()=>{if(el.isConnected)el.textContent="Could not send the result. Please check your connection and download your result.";});}
home();
</script></body></html>
