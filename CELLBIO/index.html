<header><h1>Cell Biology &amp; Biological Molecules</h1><p>Mundi Versity Tutorials Academy · Lead City University · 40 questions · No timer</p><p>Cell Biology · Biological Molecules · Vitamins</p><p class="byline">By <strong>MundiLearning CBT</strong></p></header>
<main><div id="app"></div><p class="foot">MundiLearning CBT · Based on the supplied CELL NEW NOTE course material.</p></main>
<script>
"use strict";
const QUESTIONS=[["Who first coined the term “cell” after observing thin slices of cork in 1665?",["Robert Hooke","Theodor Schwann","Matthias Schleiden","Rudolf Virchow"],0,"The notes state that Robert Hooke coined the term cell in 1665 after observing thin slices of cork through a primitive compound microscope."],["A cell is best described as the:",["Largest structural part of an organism","A group of organs working together","Smallest unit of a living organism that carries out the characteristics of life","Non-living material between tissues"],2,"The notes define the cell as the basic structural and functional unit of life and the smallest unit possessing the characteristics of a living organism."],["Which statement is part of the cell theory?",["All living things are composed of one or more cells","Every organism is made up of only one cell","Cells arise from non-living materials","Only animals are made of cells"],0,"One statement of cell theory is that all living things are composed of one or more cells."],["According to the cell theory, new cells arise from:",["The fusion of organelles","Pre-existing cells through cell division","The spontaneous formation of cytoplasm","Mineral substances"],1,"The notes state that all cells come from pre-existing cells and that new cells arise through cell division."],["Which group contains examples of unicellular organisms listed in the notes?",["Fungi, most plants and animals","Trees, insects and fish","Bacteria, blue-green algae and protozoa","Only mammals and birds"],2,"The notes list bacteria, blue-green algae and protozoa as examples of unicellular organisms."],["A prokaryotic cell is characterised by the absence of:",["Cytoplasm and ribosomes","Genetic material","A true nucleus and membrane-bound organelles","A cell membrane"],2,"Prokaryotic cells lack a true nucleus and other membrane-bound organelles, although they contain structures such as cytoplasm and ribosomes."],["The region in a prokaryotic cell where its circular chromosomal DNA is usually found is called the:",["Nucleoid","Nucleolus","Nuclear envelope","Endoplasmic lumen"],0,"The circular chromosomal DNA of a prokaryote is usually found in a region of the cytoplasm called the nucleoid."],["Plasmids are:",["Circular DNA molecules that replicate independently of chromosomal DNA","The folds of the inner mitochondrial membrane","Membrane-bound organelles","Protein structures that make ATP"],0,"The notes describe plasmids as extra-chromosomal DNA molecules, usually circular, that can replicate independently of chromosomal DNA."],["Which group consists of organisms with eukaryotic cells?",["Only blue-green algae","Only bacteria and archaea","Animals, plants, fungi and most protists","Bacteria and Mycoplasma"],2,"The notes identify animals, plants, fungi and most protists as eukaryotes. Eukaryotic cells have a true nucleus and membrane-bound organelles."],["The main function of the nucleus is to:",["Digest worn-out organelles","Direct cell activities using information stored in DNA","Transport materials outside the cell","Produce the cell wall"],1,"The nucleus contains the cell's genetic material and directs cell activities through information stored in DNA."],["The cytoplasm is best described as:",["The membrane surrounding the nucleus","A rigid outer covering made of cellulose","A gel-like fluid in which organelles are suspended and chemical reactions occur","The circular DNA region of a bacterium"],2,"The notes describe cytoplasm as a gel-like fluid, principally composed of water, that suspends organelles and provides a medium for chemical reactions."],["The cell membrane is important because it:",["Stores all the cell's DNA","Produces chlorophyll","Forms the chromosomes","Controls the movement of substances into and out of the cell"],3,"The cell membrane is selectively permeable and controls the flow of substances into and out of the cell."],["Which set correctly matches cell wall materials with the organisms in which they occur?",["Plants—cellulose; fungi—chitin; bacteria—peptidoglycan","Plants—chitin; fungi—cellulose; bacteria—starch","Plants—peptidoglycan; fungi—cellulose; bacteria—chitin","Plants—protein; fungi—starch; bacteria—lipid"],0,"The notes state that plant cell walls are mainly cellulose, fungal cell walls are mainly chitin, and bacterial cell walls contain peptidoglycan."],["The mitochondrion is called the powerhouse of the cell because it plays an important role in producing:",["DNA in the nucleus","ATP","Cellulose","Chlorophyll"],1,"Mitochondria play an important role in producing energy in the form of adenosine triphosphate (ATP)."],["The main function of ribosomes is:",["Photosynthesis","Digestion of cellular waste","Protein synthesis","Storage of water"],2,"Ribosomes are the sites of protein synthesis. The notes identify 70S ribosomes in prokaryotes and 80S ribosomes in eukaryotes."],["Which statement correctly describes the endoplasmic reticulum?",["Both types are found only in prokaryotes","Smooth ER contains the cell's chromosomes","Rough ER has ribosomes and is involved in protein production, while smooth ER mainly transports materials","Rough ER has no ribosomes and makes the cell wall"],2,"The notes describe rough ER as ribosome-covered and involved in protein production, while smooth ER is primarily involved in transporting materials through the cell."],["The Golgi apparatus is mainly involved in:",["Producing the cell's chromosomal DNA","Modifying, sorting and packaging molecules for transport or secretion","Breaking down glucose to make ATP","Forming the bacterial nucleoid"],1,"The Golgi apparatus modifies, sorts and packages molecules such as proteins and carbohydrates into vesicles for their correct destinations."],["Lysosomes contain hydrolytic enzymes that help the cell to:",["Copy chromosomal DNA","Produce ribosomes","Carry out photosynthesis","Break down waste materials and cellular debris"],3,"The notes describe lysosomes as containing hydrolytic enzymes that digest waste materials, food particles and worn-out organelles."],["The membrane surrounding the large central vacuole in plant cells is called the:",["Tonoplast","Nuclear envelope","Crista","Plasma lemma"],0,"The notes identify the single membrane surrounding the plant cell vacuole as the tonoplast. The central vacuole helps maintain osmotic pressure."],["Which organelle traps light energy for photosynthesis using chlorophyll?",["Lysosome","Mitochondrion","Centrosome","Chloroplast"],3,"Chloroplasts contain chlorophyll, which traps light energy for photosynthesis. The notes describe grana as stacks of thylakoid discs."],["Which feature is characteristic of a typical plant cell but absent in an animal cell?",["A cell membrane","Cytoplasm","Ribosomes","A cellulose cell wall and plastids"],3,"The notes state that plant cells have a rigid cellulose cell wall and plastids, whereas animal cells lack a cell wall and generally lack plastids."],["Which pairing correctly describes two structures found in some prokaryotic cells?",["Flagella digest waste; capsules form the nucleus","Flagella store DNA; capsules carry out photosynthesis","Flagella aid locomotion; capsules help retain moisture and adhere to surfaces","Flagella make proteins; capsules produce ATP"],2,"The notes describe flagella as aiding locomotion and capsules as helping cells retain moisture, adhere to surfaces and obtain protection."],["Cell differentiation is the process by which a cell:",["Loses all its organelles","Stops carrying out metabolism permanently","Becomes a particular cell type and assumes a specific function","Divides without growing"],2,"The notes define differentiation as the process by which a cell develops into a particular cell type and assumes a specific function."],["The notes describe cell growth and development as:",["An irreversible increase in cell size and development of internal structures","A temporary decrease in cell size","The removal of all organelles","The movement of a cell from one tissue to another"],0,"Cell growth and development involve an irreversible increase in cell size and the development of internal structures such as organelles."],["Which statement about cell division is correct according to the notes?",["Prokaryotes divide by mitosis and eukaryotes by binary fission","Both prokaryotes and eukaryotes divide only by meiosis","Cytokinesis takes place before nuclear division","Prokaryotes divide by binary fission, while eukaryotic cells divide by mitosis"],3,"The notes state that prokaryotes divide by binary fission, while eukaryotic cells divide by mitosis. Cytokinesis is the final division of the cell."],["Which statement correctly distinguishes apoptosis from necrosis?",["Apoptosis is accidental cell death, while necrosis is programmed","Necrosis is the normal process of cell differentiation","Both terms describe cell growth","Apoptosis is programmed cell death, while necrosis is accidental cell death due to injury"],3,"The notes identify apoptosis as programmed cell death and necrosis as accidental cell death due to injury."],["Which technique is identified in the notes as the most widely used for fractionating cellular components?",["Centrifugation","Filtration","Distillation","Chromatography"],0,"Centrifugation uses centrifugal force to separate cell organelles on the basis of characteristics such as size and density. The notes also describe homogenization and cell lysis as steps in preparing material for fractionation."],["According to the notes, micromolecules generally have molecular weights in which range?",["Less than 1 dalton","18 to 800 dalton","Exactly 1,000 dalton","Over 100,000 dalton"],1,"The notes give a molecular-weight range of 18 to 800 dalton for micromolecules."],["Which group contains the four main biological macromolecules listed in the notes?",["Water, minerals, vitamins and gases","Amino acids, ions, minerals and vitamins","Carbohydrates, proteins, nucleic acids and lipids","Glucose, oxygen, salts and water"],2,"The four main macromolecules listed are carbohydrates, proteins, nucleic acids and lipids."],["The small repeating units that make up polymers are called:",["Minerals","Monomers","Enzymes","Vitamins"],1,"The notes explain that polymers are made up of repeating smaller units known as monomers. Carbohydrates, proteins and nucleic acids are polymers; lipids are not regarded as polymers."],["Which statement about vitamins is supported by the notes?",["They are inorganic substances needed in very large amounts","They are a type of nucleic acid","They are all produced in sufficient amounts by the human body","They are organic substances required in small amounts for normal growth and body function"],3,"The notes define vitamins as organic substances required in small amounts but essential for normal growth and body function."],["Which of the following is listed as a possible cause of vitamin deficiency?",["Improved absorption","Normal metabolism","Adequate intake in every case","Increased losses"],3,"The notes list insufficient intake, impaired absorption, impaired metabolism and increased losses as causes of vitamin deficiency."],["Which set contains the fat-soluble vitamins?",["A, B, C and D","A, D, E and K","B and C only","B1, B2, B3 and C"],1,"The fat-soluble vitamins are A, D, E and K. The notes give the acronym ADEK as a way to remember them."],["Which vitamins are classified as water-soluble in the notes?",["A and D","Vitamin B complex and vitamin C","E and K","A, E and K"],1,"The notes classify the vitamin B complex and vitamin C as water-soluble vitamins."],["The main active form of vitamin A identified in the notes is:",["Retinol","Calcitriol","Ascorbic acid","Alpha-tocopherol"],0,"The notes identify retinol as the main active form of vitamin A. Vitamin A is important for vision in dim light, and deficiency may cause night blindness."],["Vitamin D helps the body to absorb:",["Iron and sodium","Calcium and phosphorus","Vitamin C and vitamin K","Glucose and amino acids"],1,"The notes state that vitamin D facilitates calcium and phosphorus absorption, supporting normal mineralisation of bones and teeth. Deficiency is associated with rickets in children and osteomalacia in adults."],["Which form of vitamin E is identified in the notes as the form used by the human body?",["Alpha-tocopherol","Retinol","Cobalamin","Phylloquinone"],0,"The notes identify alpha-tocopherol as the form of vitamin E utilised by the human body and describe its antioxidant role."],["Vitamin K is important because it supports the formation of proteins required for:",["Night vision","The absorption of vitamin C","Collagen synthesis","Blood clotting"],3,"The notes explain that vitamin K is required for post-synthesis modification of proteins involved in blood clotting, including active prothrombin."],["Vitamin C is chemically known as:",["Niacin","Riboflavin","Folic acid","Ascorbic acid"],3,"The notes identify vitamin C as ascorbic acid. They describe its antioxidant role and its involvement in collagen synthesis; deficiency causes scurvy."],["Which option correctly matches the vitamin B names listed in the notes?",["B1—retinol; B3—ascorbic acid; B9—calciferol; B12—riboflavin","B1—thiamine; B3—niacin; B9—folic acid; B12—cobalamin","B1—cobalamin; B3—folic acid; B9—thiamine; B12—niacin","B1—niacin; B3—thiamine; B9—biotin; B12—retinol"],1,"The notes identify B1 as thiamine, B3 as niacin, B9 as folic acid and B12 as cobalamin. They associate B1 deficiency with beriberi and B3 deficiency with pellagra."]];
const SUBMIT_URL="https://script.google.com/macros/s/AKfycbyOP1esKZzCUfkc0Pn_eMZVqyBup3ideOXZFDvjkiWbrXbLfwmgaBXY-01Fy9rA-ToFCw/exec";
const COURSE="Cell Biology & Biological Molecules";
const LETTERS=["A","B","C","D"],app=document.getElementById("app");
let state=null,nameDraft="";
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function grade(p){return p>=70?["A","Excellent"]:p>=60?["B","Very good"]:p>=50?["C","Good"]:p>=45?["D","Fair"]:p>=40?["E","Pass"]:["F","Fail"];}
function home(msg=""){app.innerHTML='<section class="card"><h2>Welcome</h2><p>This CBT contains <b>40 multiple-choice questions</b> based on the supplied course notes covering cells, cell structures and functions, biological molecules, and vitamins. There is <b>no timer</b>.</p><ul><li>Enter your full name and select <b>Start CBT</b>.</li><li>Select an option and click <b>Submit Answer</b> to see feedback and an explanation.</li><li>Click <b>Next</b> to continue. Use the question navigator to revisit answered questions.</li><li>Click <b>Submit CBT</b> to view your score and review your answers.</li></ul><label for="name"><b>Your full name</b></label><input id="name" type="text" autocomplete="name" maxlength="90" placeholder="Enter your full name" value="'+esc(nameDraft)+'">'+(msg?'<p style="color:var(--bad)">'+esc(msg)+'</p>':'')+'<button class="primary" id="start">Start CBT ▶</button></section>';document.getElementById("start").onclick=start;document.getElementById("name").onkeydown=e=>{if(e.key==="Enter")start();};}
function start(){let n=document.getElementById("name").value.trim();nameDraft=n;if(!n){home("Please enter your full name to begin.");return;}state={name:n,index:0,selected:Array(QUESTIONS.length).fill(-1),done:Array(QUESTIONS.length).fill(false),confirm:false};questionPage();}
function firstUnanswered(){let i=state.done.indexOf(false);return i===-1?QUESTIONS.length-1:i;}
function go(i){if(i<0||i>=QUESTIONS.length||i>firstUnanswered())return;state.index=i;state.confirm=false;questionPage();}
function choose(i){if(state.done[state.index])return;state.selected[state.index]=i;questionPage();}
function mark(){let i=state.index;if(state.done[i]||state.selected[i]===-1)return;state.done[i]=true;state.confirm=false;questionPage();}
function questionPage(){const i=state.index,q=QUESTIONS[i],done=state.done[i],selected=state.selected[i],count=state.done.filter(Boolean).length;let page='<div class="topline"><span><b>'+esc(state.name)+'</b></span><span>Answered: '+count+' / '+QUESTIONS.length+'</span></div><div class="progress"><div style="width:'+(count/QUESTIONS.length*100)+'%"></div></div><section class="card"><div class="note">Question '+(i+1)+' of '+QUESTIONS.length+'</div><div class="question">'+esc(q[0])+'</div>';q[1].forEach((opt,k)=>{let cls="option"+(done?(k===q[2]?" correct":k===selected?" incorrect":""):(k===selected?" selected":""));page+='<button type="button" class="'+cls+'" data-pick="'+k+'" '+(done?"disabled":"")+'><b>'+LETTERS[k]+'</b><span>'+esc(opt)+'</span></button>';});if(done){let right=selected===q[2];page+='<div class="explanation '+(right?"":"wrong")+'"><b>'+(right?"Correct!":"Incorrect.")+'</b> Correct answer: <b>'+LETTERS[q[2]]+'. '+esc(q[1][q[2]])+'</b>.<br>'+esc(q[3])+'</div>';}page+='<div class="actions"><div class="group"><button class="secondary" id="prev" '+(i===0?"disabled":"")+'>◀ Previous</button><button class="positive" id="mark" '+(done||selected===-1?"disabled":"")+'>Submit Answer</button></div><div class="group"><button class="primary" id="next" '+(i===QUESTIONS.length-1||!done?"disabled":"")+'>Next ▶</button><button class="finish" id="finish">Submit CBT ✔</button></div></div>';if(state.confirm)page+='<div class="warning"><b>'+(QUESTIONS.length-count)+' unanswered question(s).</b> Unanswered questions receive zero. Finish anyway?<div class="actions"><button class="finish" id="sure">Yes, submit</button><button class="secondary" id="cancel">Go back</button></div></div>';page+='</section><section class="card"><b>Question navigator</b><div class="navigator">';QUESTIONS.forEach((_,k)=>{let cls=(state.done[k]?(state.selected[k]===QUESTIONS[k][2]?"correct":"incorrect"):"")+(k===i?" active":"");page+='<button type="button" data-go="'+k+'" class="'+cls+'" '+(k>firstUnanswered()?"disabled":"")+' aria-label="Go to question '+(k+1)+'">'+(k+1)+'</button>';});page+='</div><div class="note">Green = correct · Red = incorrect · Plain = not answered. Questions unlock in sequence.</div></section>';app.innerHTML=page;app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>choose(Number(b.dataset.pick)));app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));document.getElementById("prev").onclick=()=>go(i-1);document.getElementById("next").onclick=()=>go(i+1);document.getElementById("mark").onclick=mark;document.getElementById("finish").onclick=()=>{if(count<QUESTIONS.length){state.confirm=true;questionPage();}else resultPage();};if(state.confirm){document.getElementById("sure").onclick=resultPage;document.getElementById("cancel").onclick=()=>{state.confirm=false;questionPage();};}window.scrollTo(0,0);}
function resultData(){let score=0;const answers=QUESTIONS.map((q,i)=>{let ok=state.done[i]&&state.selected[i]===q[2];if(ok)score++;return (i+1)+":"+(state.done[i]?LETTERS[state.selected[i]]:"-")+(ok?"+":"-");});let percent=Math.round(score/QUESTIONS.length*1000)/10;return{name:state.name,academy:"Mundi Versity Tutorials Academy",institution:"Lead City University",assessmentId:"CELLBIO",course:COURSE,score,total:QUESTIONS.length,percent,grade:grade(percent)[0],answers:answers.join(" ")};}
function reportText(d){return "MundiLearning CBT - "+COURSE+"\nAcademy: "+d.academy+"\nInstitution: "+d.institution+"\nAssessment ID: "+d.assessmentId+"\nStudent: "+d.name+"\nScore: "+d.score+"/"+d.total+"\nPercentage: "+d.percent+"%\nGrade: "+d.grade+"\nDate: "+new Date().toLocaleString()+"\nAnswers (+ correct, - wrong/skipped):\n"+d.answers+"\n";}
function download(){let d=resultData(),blob=new Blob([reportText(d)],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Cell_Biology_CBT_result_"+d.name.replace(/[^a-z0-9_-]/gi,"_")+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function resultPage(){const d=resultData(),g=grade(d.percent);let page='<section class="card"><h2>CBT Result</h2><p class="muted">'+esc(d.name)+' · '+esc(COURSE)+'</p><div class="stats"><div class="stat"><strong>'+d.score+'/'+d.total+'</strong><small>Score</small></div><div class="stat"><strong>'+d.percent+'%</strong><small>Percentage</small></div><div class="stat"><strong>'+g[0]+'</strong><small>'+g[1]+'</small></div></div><p class="note">Practice grading: A ≥70% · B ≥60% · C ≥50% · D ≥45% · E ≥40% · F &lt;40%.</p><div class="actions"><div class="group"><button class="primary" id="retake">Retake CBT ↻</button><button class="secondary" id="download">Download my result ↓</button></div></div><p class="note" id="sendstatus"></p></section><section class="card"><h3>Complete answer review</h3>';QUESTIONS.forEach((q,i)=>{let ans=state.done[i]?state.selected[i]:-1,ok=ans===q[2];page+='<div class="review"><span class="badge '+(ok?"":"no")+'">'+(ok?"Correct":ans<0?"Skipped":"Incorrect")+'</span> <span class="heading">Question '+(i+1)+'. '+esc(q[0])+'</span><br><b>Your answer:</b> '+(ans===-1?"—":esc(LETTERS[ans]+". "+q[1][ans]))+'<br><b>Correct answer:</b> '+esc(LETTERS[q[2]]+". "+q[1][q[2]])+'<br><span class="note">'+esc(q[3])+'</span></div>';});app.innerHTML=page+'</section>';document.getElementById("download").onclick=download;document.getElementById("retake").onclick=()=>{nameDraft=state.name;state=null;home();};window.scrollTo(0,0);sendResult(d);}
function sendResult(d){const el=document.getElementById("sendstatus");if(!SUBMIT_URL){el.textContent="Online reporting is not configured. Download your result instead.";return;}el.textContent="Attempting to send your result to the teacher's reporting service…";fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)}).then(()=>{if(el.isConnected)el.textContent="Submission request completed. The reporting service does not provide a receipt, so delivery cannot be confirmed here. You may also download your result.";}).catch(()=>{if(el.isConnected)el.textContent="Could not send the result. Please check your connection and download your result.";});}
home();
