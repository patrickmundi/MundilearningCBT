<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="MundiLearning CBT">
<meta name="description" content="PCH 201 Thermodynamics CBT for Lead City University students.">
<title>PCH 201 · Thermodynamics | MundiLearning CBT</title>
<style>
:root{--bg:#f2f5fb;--card:#fff;--ink:#17233b;--mute:#60718b;--pri:#284b97;--soft:#e8edf8;--line:#d5dfee;--ok:#167b45;--okbg:#e5f7ed;--bad:#bd382d;--badbg:#fff0ef;--amber:#a65c00;--shadow:rgba(25,47,93,.1)}
@media(prefers-color-scheme:dark){:root{--bg:#10172b;--card:#1b2741;--ink:#f0f3fa;--mute:#b5c2d8;--pri:#87a6fc;--soft:#2a3857;--line:#415270;--ok:#56ce87;--okbg:#193a2d;--bad:#ff9c92;--badbg:#482927;--amber:#e5ab64;--shadow:rgba(0,0,0,.26)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}header{background:#203c75;color:#fff;padding:16px max(16px,calc((100vw - 900px)/2))}header h1{font-size:1.15rem;line-height:1.4;margin:0}header p{font-size:.84rem;margin:2px 0 0;opacity:.87}header .byline{margin-top:5px;opacity:1}main{max-width:900px;margin:auto;padding:15px 14px 36px}.card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 11px var(--shadow);margin-bottom:14px}h2{margin:0 0 10px;font-size:1.42rem}h3{margin:0 0 12px}p{margin:9px 0 13px}.muted,.note{color:var(--mute);font-size:.88rem}input[type=text]{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);font:inherit;margin:8px 0 14px}button{font:inherit;font-weight:650;cursor:pointer;border:0;border-radius:9px;padding:11px 14px}button:disabled{opacity:.44;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid #6c99eb;outline-offset:2px}.primary{background:#284b97;color:#fff}.secondary{background:var(--soft);color:var(--ink)}.positive{background:#197548;color:#fff}.finish{background:#9d5a0d;color:#fff}.topline,.actions,.actions .group{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.topline{margin-bottom:8px;color:var(--mute);font-size:.92rem}.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:14px}.progress>div{height:100%;background:#416dbe;transition:width .2s}.question{font-size:1.13rem;font-weight:700;margin:8px 0 16px}.option{width:100%;display:flex;gap:12px;text-align:left;align-items:flex-start;background:var(--card);color:var(--ink);border:2px solid var(--line);padding:11px;margin-bottom:9px;font-weight:500}.option b{background:var(--soft);padding:2px 8px;border-radius:7px;min-width:30px;text-align:center}.option.selected{border-color:#5084e6;background:var(--soft)}.option.correct{border-color:var(--ok);background:var(--okbg)}.option.incorrect{border-color:var(--bad);background:var(--badbg)}.option.correct b{background:var(--ok);color:#fff}.option.incorrect b{background:var(--bad);color:#fff}.explanation{background:var(--okbg);border-left:5px solid var(--ok);padding:13px;border-radius:7px;margin-top:12px}.explanation.wrong{background:var(--badbg);border-color:var(--bad)}.actions{margin-top:14px}.actions .group{justify-content:flex-start}.navigator{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px;margin-top:12px}.navigator button{padding:8px 1px;color:var(--ink);background:var(--soft);border:2px solid transparent}.navigator button.active{border-color:#5e8de0}.navigator button.correct{background:#177a47;color:#fff}.navigator button.incorrect{background:#b43b30;color:#fff}.warning{padding:12px;border-left:5px solid var(--amber);background:var(--soft);border-radius:8px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:11px;margin:16px 0}.stat{background:var(--soft);border-radius:11px;text-align:center;padding:13px}.stat strong{display:block;font-size:1.65rem}.stat small{color:var(--mute)}.review{border-bottom:1px solid var(--line);padding:13px 0}.review:last-child{border-bottom:0}.review .heading{font-weight:700}.badge{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--ok);color:#fff;font-size:.75rem;font-weight:700}.badge.no{background:var(--bad)}a{color:#537ee2}.foot{text-align:center;font-size:.8rem;color:var(--mute);padding:8px}@media(max-width:560px){main{padding:12px 10px 26px}.card{padding:15px}.actions .group{width:100%;justify-content:space-between}.actions button{flex:1}}
</style>
</head>
<body>
<header>
  <h1>PCH 201 · Thermodynamics for Drug Development</h1>
  <p>Lead City University, Ibadan · 2026/2027 · 40 questions · No timer</p>
  <p class="byline">By <strong>MundiLearning CBT</strong></p>
</header>
<main><div id="app"></div><p class="foot">MundiLearning CBT · Educational practice based on the supplied Thermodynamics teaching note.</p></main>
<script>
"use strict";
const QUESTIONS=[
["Thermodynamics is the study of:",["Energy, heat, work and the direction of physical or chemical processes","Only the speed of chemical reactions","Only the colour of chemical substances","The naming of organic compounds"],0,"Thermodynamics concerns energy, heat, work and whether processes are favourable. It also describes equilibrium states."],
["Which statement correctly distinguishes thermodynamics from kinetics?",["Thermodynamics explains reaction rate, while kinetics explains equilibrium","Thermodynamics indicates whether a process is favourable, while kinetics studies how quickly it occurs","They are two names for exactly the same field","Kinetics studies only changes in colour"],1,"Thermodynamics predicts favourability and equilibrium. Kinetics studies rates and mechanisms."],
["In thermodynamics, the system is:",["Everything outside the reaction vessel","Only the thermometer used for measurement","The part of the universe selected for study","The product formed after equilibrium"],2,"The system is the part of the universe being studied. The surroundings are everything outside it."],
["An open system exchanges:",["Neither matter nor energy","Both matter and energy with its surroundings","Energy only","Matter only"],1,"An open system can exchange both matter and energy. An uncovered dissolving vessel is an example from the note."],
["A sealed vial that can be heated is an example of a:",["Closed system","Isolated system","Open system","Reversible system"],0,"A closed system exchanges energy but not matter. A sealed vial can be heated without material escaping."],
["An isolated system exchanges:",["Both matter and energy","Energy but not matter","Matter but not energy","Neither matter nor energy"],3,"An isolated system exchanges neither matter nor energy. This is an idealised model."],
["The first law of thermodynamics is fundamentally a statement of:",["Conservation of energy","Conservation of mass only","Constant temperature","Constant pressure"],0,"The first law states that energy cannot be created or destroyed. It can only be transferred or converted."],
["Using the sign convention ΔU = q + w, heat entering the system is:",["Negative","Positive","Always zero","Equal to the pressure"],1,"Heat transferred to the system is positive. Work done on the system is also positive under this sign convention."],
["A system releases 150 J of heat while 30 J of work is done on it. What is ΔU?",["−180 J","−120 J","+120 J","+180 J"],1,"Released heat gives q = −150 J. Work done on the system gives w = +30 J. Therefore ΔU = −150 + 30 = −120 J."],
["A process absorbs 250 J of heat and 40 J of work is done on the system. What is ΔU?",["−290 J","−210 J","+210 J","+290 J"],3,"Both terms are positive under the stated sign convention: ΔU = 250 + 40 = +290 J."],
["Enthalpy is defined as:",["H = U + pV","H = pV − U","G = H − TS","S = q/T only"],0,"Enthalpy is H = U + pV. At constant pressure, the heat exchanged is equal to the enthalpy change when only pressure-volume work occurs."],
["An endothermic process:",["Releases heat and has ΔH < 0","Absorbs heat and has ΔH > 0","Always occurs instantly","Has no change in enthalpy"],1,"An endothermic process absorbs heat, so its enthalpy change is positive."],
["An exothermic process:",["Releases heat and has ΔH < 0","Absorbs heat and has ΔH > 0","Always has ΔG < 0","Always occurs slowly"],0,"An exothermic process releases heat, giving a negative enthalpy change. It is not automatically spontaneous."],
["Entropy is best introduced as a measure of:",["Matter leaving a closed system","Energy dispersal and the number of accessible microscopic arrangements","Pressure multiplied by volume","Reaction speed only"],1,"Entropy relates to energy dispersal and accessible arrangements. A common introduction is that entropy tends to increase in a spontaneous isolated process."],
["The second law of thermodynamics states that:",["Entropy always remains exactly constant","A spontaneous isolated process tends to increase total entropy","Energy can be created under pressure","All exothermic reactions are spontaneous"],1,"In a spontaneous process, total entropy of the system and surroundings increases. Entropy is not a guarantee that the process will be fast."],
["If a process has ΔG < 0 at constant temperature and pressure, it is:",["Thermodynamically unfavourable","At equilibrium","Thermodynamically favourable in the forward direction","Guaranteed to occur very quickly"],2,"A negative Gibbs free-energy change indicates that the forward process is thermodynamically favourable. It does not determine the rate."],
["At constant temperature and pressure, ΔG = 0 indicates that the system is:",["At equilibrium","Completely decomposed","Irreversibly stopped","Free of entropy"],0,"When ΔG is zero, the forward and reverse tendencies balance at equilibrium."],
["A positive ΔG at constant temperature and pressure means:",["The forward process is favoured","The reverse direction is favoured","The process occurs instantly","The temperature must be zero"],1,"A positive ΔG indicates that the forward process is unfavourable and the reverse direction is favoured."],
["Which equation is used to predict thermodynamic favourability at constant temperature and pressure?",["ΔG = ΔH − TΔS","ΔU = q − pV","Kd = [D][R]/[DR]","Ka = [H⁺][A⁻]/[HA]"],0,"The Gibbs free-energy relation is ΔG = ΔH − TΔS, with T expressed in kelvin."],
["Before using ΔG = ΔH − TΔS, ΔS = +100 J mol⁻¹ K⁻¹ should be converted to:",["0.001 kJ mol⁻¹ K⁻¹","0.010 kJ mol⁻¹ K⁻¹","0.100 kJ mol⁻¹ K⁻¹","100 kJ mol⁻¹ K⁻¹"],2,"Divide by 1000 because 1 kJ equals 1000 J. The value becomes 0.100 kJ mol⁻¹ K⁻¹."],
["If ΔH = +20 kJ mol⁻¹ and ΔS = +0.100 kJ mol⁻¹ K⁻¹ at 298 K, what is ΔG?",["+49.8 kJ mol⁻¹","+9.8 kJ mol⁻¹","0.0 kJ mol⁻¹","−9.8 kJ mol⁻¹"],3,"ΔG = 20 − (298 × 0.100) = 20 − 29.8 = −9.8 kJ mol⁻¹."],
["A process can be spontaneous even when it absorbs heat if:",["It is exothermic","The entropy contribution is sufficiently favourable","The pressure is constant","It is catalysed"],1,"Increasing entropy can make −TΔS negative enough to offset a positive ΔH, producing ΔG < 0."],
["A phase is best described as:",["A physically distinct form of matter such as solid, liquid or gas","A single chemical element","A reaction that has stopped","A change in temperature only"],0,"A phase is a physically distinct form of matter. A phase transition changes one phase into another."],
["Melting is the transition from:",["Liquid to gas","Solid to liquid","Gas to solid","Liquid to solid"],1,"Melting changes a solid into a liquid. It is relevant to melting-point identification, purity assessment and hot-melt processing."],
["Sublimation is used in freeze-drying because it involves:",["Liquid changing directly to solid","Solid changing directly to gas","Gas changing directly to liquid","Solid changing to liquid"],1,"Sublimation changes a solid directly to gas. In lyophilisation, ice is removed under reduced pressure."],
["Polymorphs have:",["Different chemical formulas and different crystal packing","The same chemical composition but different crystal packing","The same crystal structure and exactly the same stability","No relationship to drug dissolution"],1,"Polymorphs have the same chemical composition but different crystal arrangements. Their melting point, stability, density and dissolution behaviour may differ."],
["A metastable polymorph may:",["Dissolve faster but convert to a more stable form during storage or processing","Always be more stable than every other form","Have a different chemical formula","Eliminate all formulation risks"],0,"A metastable form may offer faster dissolution, but physical instability and conversion are important formulation concerns."],
["Amorphous drug solids:",["Have long-range crystal order","Cannot dissolve","Always have lower apparent solubility than crystals","Lack long-range crystal order and may dissolve faster but can be physically unstable"],3,"Amorphous solids lack long-range crystal order. They may show higher apparent solubility or faster dissolution but can recrystallise."],
["Solubility is defined as:",["The speed at which a solid leaves its surface","The maximum equilibrium amount of a substance that dissolves in a specified solvent under stated conditions","The number of particles in a tablet","The rate of blood flow to a tissue"],1,"Solubility is an equilibrium property measured under specified temperature, pressure and solvent conditions."],
["Which statement correctly distinguishes solubility from dissolution rate?",["They are always identical","Solubility is a kinetic property while dissolution rate is an equilibrium property","Solubility is an equilibrium property while dissolution rate is a kinetic property","Neither depends on the solvent"],2,"Solubility describes the equilibrium amount dissolved. Dissolution rate describes how quickly the solid enters solution."],
["In the dissolution process, wetting means:",["The liquid makes contact with the drug-particle surface","Drug molecules enter the bloodstream","The crystal lattice changes polymorph","A precipitate forms"],0,"Wetting is the initial contact between the liquid and the solid surface. Poor wetting can slow dissolution."],
["In the Noyes–Whitney relationship, increasing surface area A generally:",["Decreases dissolution rate","Increases dissolution rate","Has no effect on dissolution","Changes only the equilibrium constant"],1,"The rate expression contains A in the numerator. Greater surface area generally increases the dissolution rate."],
["Which change is most directly expected to increase dissolution rate through greater surface area?",["Increasing particle size","Reducing particle size","Increasing the diffusion-layer thickness","Removing agitation"],1,"Smaller particles provide greater surface area, which commonly increases dissolution rate."],
["Which factor generally increases dissolution rate by reducing the diffusion-layer thickness?",["Gentle agitation of the dissolution medium","Increasing particle size","Cooling every drug suspension","Adding a common ion"],0,"Agitation can reduce the diffusion-layer thickness h. The Noyes–Whitney relationship predicts an increase in dissolution rate."],
["Which statement about temperature and solubility is correct?",["All solids become less soluble as temperature rises","All solids become more soluble as temperature rises","The effect depends on the dissolution enthalpy and is not universal","Temperature never affects solubility"],2,"For many solids solubility increases with temperature, but this is not universal. The direction depends on the thermodynamics of dissolution."],
["Adding an ion already present in a salt's dissolution equilibrium generally:",["Increases solubility","Decreases solubility through the common-ion effect","Has exactly no effect","Changes the salt into an amorphous solid"],1,"The common-ion effect shifts the equilibrium and can reduce solubility."],
["For a weak acid, raising pH above its pKa generally:",["Increases the unionised fraction","Increases the ionised fraction","Prevents ionisation completely","Always reduces aqueous solubility"],1,"When pH is above pKa, the ionised form of a weak acid predominates. This can increase aqueous solubility."],
["A weak acid has pKa 4.0 and is placed in a medium at pH 6.0. The approximate ratio [A⁻]/[HA] is:",["0.01","0.10","1.00","100"],3,"Using pH = pKa + log([A⁻]/[HA]), log ratio = 6.0 − 4.0 = 2. The ratio is 10² = 100."],
["For a simple 1:1 drug-receptor interaction, a lower Kd generally indicates:",["Weaker binding affinity","No binding","Tighter binding affinity","A larger molecular weight"],2,"For D + R ⇌ DR, Kd = [D][R]/[DR]. A lower Kd generally indicates tighter binding under the measurement conditions."],
["Which statement is correct?",["Strong receptor affinity always means strong efficacy","Affinity and efficacy are the same property","Affinity describes binding, while efficacy describes the biological response produced after binding","A larger Kd always means stronger efficacy"],2,"A drug may bind tightly but produce little or no response. Affinity and efficacy are distinct."]
];
const SUBMIT_URL="https://script.google.com/macros/s/AKfycbyOP1esKZzCUfkc0Pn_eMZVqyBup3ideOXZFDvjkiWbrXbLfwmgaBXY-01Fy9rA-ToFCw/exec";
const COURSE="LCU-PCH201 - Thermodynamics for Drug Development";
const LETTERS=["A","B","C","D"];
const app=document.getElementById("app");
let state=null;
let nameDraft="";
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function grades(p){return p>=70?["A","Excellent"]:p>=60?["B","Very good"]:p>=50?["C","Good"]:p>=45?["D","Fair"]:p>=40?["E","Pass"]:["F","Fail"];}
function home(message=""){
  app.innerHTML='<section class="card"><h2>Welcome</h2>'+
    '<p>This CBT contains <b>40 multiple-choice questions</b> on <b>Thermodynamics for Drug Development</b>, based on the supplied PCH 201 teaching note. There is <b>no timer</b>.</p>'+
    '<ul><li>Enter your full name and select <b>Start CBT</b>.</li><li>Choose an option and click <b>Submit Answer</b> to see the correct answer and explanation.</li><li>Click <b>Next</b> to continue. Use the navigator to revisit answered questions.</li><li>Click <b>Submit CBT</b> to view your score, grade and complete review.</li></ul>'+
    '<p class="note">The page sends your name and result to the same teacher-reporting service used by the other MundiLearning CBTs. The service does not provide a delivery receipt, so you can also download your result.</p>'+
    '<label for="name"><b>Your full name</b></label><input id="name" type="text" autocomplete="name" maxlength="90" placeholder="e.g. Ope" value="'+escapeHtml(nameDraft)+'">'+
    (message?'<p style="color:var(--bad)">'+escapeHtml(message)+'</p>':'')+
    '<button class="primary" id="start">Start CBT ▶</button></section>';
  document.getElementById("start").onclick=start;
  document.getElementById("name").onkeydown=e=>{if(e.key==="Enter")start();};
}
function start(){
  const n=document.getElementById("name").value.trim();nameDraft=n;
  if(!n){home("Please enter your full name to begin.");return;}
  state={name:n,index:0,selected:Array(QUESTIONS.length).fill(-1),done:Array(QUESTIONS.length).fill(false),confirm:false,finished:false};
  questionPage();
}
function firstUnanswered(){const i=state.done.indexOf(false);return i===-1?QUESTIONS.length-1:i;}
function changeQuestion(i){if(i<0||i>=QUESTIONS.length||i>firstUnanswered()||state.finished)return;state.index=i;state.confirm=false;questionPage();}
function choose(i){if(state.done[state.index])return;state.selected[state.index]=i;questionPage();}
function markAnswer(){const i=state.index;if(state.done[i]||state.selected[i]===-1)return;state.done[i]=true;state.confirm=false;questionPage();}
function questionPage(){
  const i=state.index,q=QUESTIONS[i],done=state.done[i],selected=state.selected[i],count=state.done.filter(Boolean).length;
  let page='<div class="topline"><span><b>'+escapeHtml(state.name)+'</b></span><span>Answered: '+count+' / '+QUESTIONS.length+'</span></div>'+
  '<div class="progress"><div style="width:'+(count/QUESTIONS.length*100)+'%"></div></div>'+
  '<section class="card"><div class="note">Question '+(i+1)+' of '+QUESTIONS.length+'</div><div class="question">'+escapeHtml(q[0])+'</div>';
  q[1].forEach((opt,k)=>{
    const cls="option"+(done?(k===q[2]?" correct":k===selected?" incorrect":""):(k===selected?" selected":""));
    page+='<button type="button" class="'+cls+'" data-pick="'+k+'" '+(done?"disabled":"")+'><b>'+LETTERS[k]+'</b><span>'+escapeHtml(opt)+'</span></button>';
  });
  if(done){
    const right=selected===q[2];
    page+='<div class="explanation '+(right?"":"wrong")+'"><b>'+(right?"Correct!":"Incorrect.")+'</b> Correct answer: <b>'+LETTERS[q[2]]+'. '+escapeHtml(q[1][q[2]])+'</b>.<br>'+escapeHtml(q[3])+'</div>';
  }
  page+='<div class="actions"><div class="group"><button class="secondary" id="prev" '+(i===0?"disabled":"")+'>◀ Previous</button><button class="positive" id="mark" '+(done||selected===-1?"disabled":"")+'>Submit Answer</button></div>'+
    '<div class="group"><button class="primary" id="next" '+(i===QUESTIONS.length-1||!done?"disabled":"")+'>Next ▶</button><button class="finish" id="finish">Submit CBT ✔</button></div></div>';
  if(state.confirm){
    page+='<div class="warning"><b>'+(QUESTIONS.length-count)+' unanswered question(s).</b> Unanswered questions receive zero. Finish anyway?<div class="actions"><button class="finish" id="sure">Yes, submit</button><button class="secondary" id="cancel">Go back</button></div></div>';
  }
  page+='</section><section class="card"><b>Question navigator</b><div class="navigator">';
  QUESTIONS.forEach((_,k)=>{
    const cls=(state.done[k]?(state.selected[k]===QUESTIONS[k][2]?"correct":"incorrect"):"")+(k===i?" active":"");
    page+='<button type="button" data-go="'+k+'" class="'+cls+'" '+(k>firstUnanswered()?"disabled":"")+' aria-label="Go to question '+(k+1)+'">'+(k+1)+'</button>';
  });
  page+='</div><div class="note">Green = correct · Red = incorrect · Plain = not answered. Questions unlock in sequence.</div></section>';
  app.innerHTML=page;
  app.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>choose(Number(b.dataset.pick))));
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>changeQuestion(Number(b.dataset.go))));
  document.getElementById("prev").onclick=()=>changeQuestion(i-1);
  document.getElementById("next").onclick=()=>changeQuestion(i+1);
  document.getElementById("mark").onclick=markAnswer;
  document.getElementById("finish").onclick=()=>{if(count<QUESTIONS.length){state.confirm=true;questionPage();}else resultPage();};
  if(state.confirm){
    document.getElementById("sure").onclick=resultPage;
    document.getElementById("cancel").onclick=()=>{state.confirm=false;questionPage();};
  }
  window.scrollTo(0,0);
}
function resultData(){
  let score=0;
  const ans=QUESTIONS.map((q,i)=>{const ok=state.done[i]&&state.selected[i]===q[2];if(ok)score++;return (i+1)+":"+(state.done[i]?LETTERS[state.selected[i]]:"-")+(ok?"+":"-");});
  const percent=Math.round(score/QUESTIONS.length*1000)/10;
  return {name:state.name,academy:"MundiLearning UNI-TUTORIAL Academy",institution:"Lead City University",assessmentId:"THERMO",course:COURSE,score,total:QUESTIONS.length,percent,grade:grades(percent)[0],answers:ans.join(" ")};
}
function reportText(d){
  return "MundiLearning CBT - Thermodynamics for Drug Development\nStudent: "+d.name+"\nCourse: "+d.course+"\nScore: "+d.score+"/"+d.total+"\nPercentage: "+d.percent+"%\nGrade: "+d.grade+"\nDate: "+new Date().toLocaleString()+"\nAnswers (+ correct, - wrong/skipped):\n"+d.answers+"\n";
}
function downloadReport(){
  const d=resultData(),blob=new Blob([reportText(d)],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download="THERMO_CBT_result_"+d.name.replace(/[^a-z0-9_-]/gi,"_")+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function resultPage(){
  state.finished=true;
  const d=resultData(),g=grades(d.percent);
  let page='<section class="card"><h2>CBT Result</h2><p class="muted">'+escapeHtml(d.name)+' · '+escapeHtml(COURSE)+'</p>'+
    '<div class="stats"><div class="stat"><strong>'+d.score+'/'+d.total+'</strong><small>Score</small></div><div class="stat"><strong>'+d.percent+'%</strong><small>Percentage</small></div><div class="stat"><strong>'+g[0]+'</strong><small>'+g[1]+'</small></div></div>'+
    '<p class="note">Practice grading: A ≥70% · B ≥60% · C ≥50% · D ≥45% · E ≥40% · F &lt;40%.</p>'+
    '<div class="actions"><div class="group"><button class="primary" id="retake">Retake CBT ↻</button><button class="secondary" id="download">Download my result ↓</button></div></div>'+
    '<p class="note" id="sendstatus"></p></section><section class="card"><h3>Complete answer review</h3>';
  QUESTIONS.forEach((q,i)=>{
    const ans=state.done[i]?state.selected[i]:-1,ok=ans===q[2];
    page+='<div class="review"><span class="badge '+(ok?"":"no")+'">'+(ok?"Correct":ans<0?"Skipped":"Incorrect")+'</span> <span class="heading">Question '+(i+1)+'. '+escapeHtml(q[0])+'</span>'+
      '<br><b>Your answer:</b> '+(ans===-1?"—":escapeHtml(LETTERS[ans]+". "+q[1][ans]))+
      '<br><b>Correct answer:</b> '+escapeHtml(LETTERS[q[2]]+". "+q[1][q[2]])+
      '<br><span class="note">'+escapeHtml(q[3])+'</span></div>';
  });
  app.innerHTML=page+'</section>';
  document.getElementById("download").onclick=downloadReport;
  document.getElementById("retake").onclick=()=>{nameDraft=state.name;state=null;home();};
  window.scrollTo(0,0);
  sendResult(d);
}
function sendResult(d){
  const el=document.getElementById("sendstatus");
  if(!SUBMIT_URL){el.textContent="Online result reporting is not configured. Download your result instead.";return;}
  el.textContent="Attempting to send your result to the teacher's reporting service…";
  fetch(SUBMIT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(d)})
    .then(()=>{if(el.isConnected)el.textContent="Result submission request completed. The reporting service does not provide a receipt, so delivery cannot be confirmed here. You may also download your result.";})
    .catch(()=>{if(el.isConnected)el.innerHTML='Could not send the result. Check your connection and <button class="secondary" id="retry">retry submission</button>.';const b=document.getElementById("retry");if(b)b.onclick=()=>sendResult(d);});
}
home();
</script>
</body>
</html>
